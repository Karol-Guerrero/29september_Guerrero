    <!-- Script de alternancia de diagramas -->
    <script>
        function showDiagram(num) {
            const diagrams = [
                document.getElementById('diagram1'),
                document.getElementById('diagram2'),
                document.getElementById('diagram3')
            ];
            const buttons = [
                document.getElementById('btn-diag1'),
                document.getElementById('btn-diag2'),
                document.getElementById('btn-diag3')
            ];

            diagrams.forEach((diag, index) => {
                if (index === num - 1) {
                    diag.classList.remove('hidden');
                    buttons[index].className = "px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition-all duration-200 border border-transparent";
                } else {
                    diag.classList.add('hidden');
                    buttons[index].className = "px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold rounded-lg shadow-md transition-all duration-200 border border-slate-300";
                }
            });
        }
    </script>
